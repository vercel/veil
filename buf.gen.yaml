version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/vercel/veil/api/go
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
plugins:
  - remote: buf.build/protocolbuffers/go
    out: api/go
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/protoschema-jsonschema
    out: api/jsonschema
    # Unknown keys are ignored rather than rejected, so a kind.json
    # written against a newer veil still validates against an older
    # veil's schemas. Adding a field stays a non-breaking change.
    opt:
      - additional_properties=true
