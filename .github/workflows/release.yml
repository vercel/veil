name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A versioned release is published only for a valid semver tag
  # (vMAJOR.MINOR.PATCH, with optional -prerelease / +build metadata). The
  # build and release jobs gate on this, so a malformed tag fails fast and
  # publishes nothing.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        run: |
          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if printf '%s' "$tag" | grep -Eq "$semver"; then
            echo "✓ '$tag' is a valid semantic version."
          else
            echo "::error::Tag '$tag' is not a valid semantic version. Expected vMAJOR.MINOR.PATCH (e.g. v1.2.3), optionally with -prerelease / +build metadata."
            exit 1
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          output="veil-${GOOS}-${GOARCH}${ext}"
          version="${GITHUB_REF_NAME}"
          go build -ldflags="-s -w -X main.version=${version}" -o "$output" ./cmd/veil
          chmod +x "$output"

      - uses: actions/upload-artifact@v4
        with:
          name: veil-${{ matrix.goos }}-${{ matrix.goarch }}
          path: veil-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
