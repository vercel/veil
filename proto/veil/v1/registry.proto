syntax = "proto3";

package veil.v1;

import "buf/validate/validate.proto";
import "veil/v1/config.proto";

// Kind is the compiled output of `veil build` for a single kind. It bundles
// every source file's contents and every hook's minified code into a
// single document, so rendering does not need access to the original
// filesystem. Compare with KindDefinition (config.proto), which is the
// hand-authored source-side shape that this is compiled from.
message Kind {
  // Name of the kind (matches KindDefinition.name). Same naming rules
  // — lowercase letter start, then `[a-z0-9_-]`.
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$",
    (buf.validate.field).required = true
  ];

  // Deprecated: use `files`, whose entries carry the same contents and
  // schema plus a `render` flag. Still written by `veil build` — every
  // file with render=true is mirrored here — so a registry built by a
  // newer veil stays readable by an older one. A reader that understands
  // `files` should ignore this.
  repeated Source sources = 2 [deprecated = true];

  // Files that make up the kind, each carrying its own contents, the
  // schema it validates against when declared, and whether it seeds the
  // rendered output. Supersedes `sources`: a kind may declare either or
  // both, and the loader folds `sources` in as files with render=true.
  repeated File files = 7;

  // Compiled hooks grouped by lifecycle point — render hooks plus the
  // per-consumer dependent block. Mirrors KindDefinition.hooks.
  Hooks hooks = 3;

  // Input variable declarations copied from veil.json. Consumers resolve
  // values from --var flags, VEIL_VAR_* env vars, or the declared default.
  map<string, Variable> variables = 4 [(buf.validate.field).map.keys.string.pattern = "^[a-zA-Z_][a-zA-Z0-9_]*$"];

  // Whether every dependency of a resource of this kind forwards to
  // that resource's consumers, copied from
  // KindDefinition.forward_dependencies. Read at resolve time together
  // with each edge's own `forward` flag — an edge forwards when either
  // says so.
  bool forward_dependencies = 6;
}

// Source is one compiled source file: where it lives in the kind, what
// it contains, and the schema it is checked against. Everything a
// consumer needs to read and validate the file is inlined here, so
// render never reaches back to the kind directory.
message Source {
  // Path relative to the kind directory (e.g. "sources/app.json"). Also
  // the source's identity through the render pipeline — hooks may remap
  // where a file is written without changing this.
  string path = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];

  // Raw file contents. May be empty: an empty source file is valid.
  string contents = 2;

  // Inlined JSON Schema for this source, as raw JSON text — like
  // DependentHook.params_schema, so validation needs no filesystem
  // access to the kind directory. Unset when the source declared no
  // schema, in which case its contents are never schema-checked.
  optional string schema = 3;
}

// File is one compiled file belonging to a kind: where it lives, what it
// contains, the schema it is checked against, and whether it seeds the
// rendered output. Everything a consumer needs to read and validate the
// file is inlined here, so render never reaches back to the kind
// directory.
//
// Supersedes Source, which it matches field for field apart from
// `render`. A kind's `sources` load as files with render=true.
message File {
  // Path relative to the kind directory (e.g. "files/app.json"). Also
  // the file's identity through the render pipeline — hooks may remap
  // where a file is written without changing this.
  string path = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];

  // Raw file contents. May be empty: an empty file is valid.
  string contents = 2;

  // Inlined JSON Schema for this file, as raw JSON text — like
  // DependentHook.params_schema, so validation needs no filesystem
  // access to the kind directory. Unset when the file declared no
  // schema, in which case its contents are never schema-checked.
  optional string schema = 3;

  // Whether this file seeds the rendered resource. True and it starts
  // the render bundle and is written to the output directory; false and
  // it is an asset the kind ships for its hooks to read, present in the
  // hook FS but never written. Files folded in from `sources` are
  // always true.
  bool render = 4;
}

// Hooks mirrors KindDefinition.hooks but holds compiled/bundled hook
// entries rather than paths.
message Hooks {
  // Compiled hooks that run during `veil render`, in declaration order.
  repeated Hook render = 1;

  // Compiled per-consumer dependent entries (one per consumer kind that
  // may depend on this resource). Carries bundled hook code plus the
  // inlined params JSON Schema so render does not need access to the
  // original kind directory.
  repeated DependentHook dependents = 2;

  // Compiled validation hooks that run after every other lifecycle
  // point has completed. Bundle / ctx mutations from these hooks are
  // discarded; only the returned `ValidationIssue` entries (or thrown
  // errors) are observable. Mirrors HooksDefinition.validate.
  repeated Hook validate = 3;

  // Compiled post-render hooks. Run after resource-level render hooks
  // and before validate; same RenderHook(ctx, fs) contract as
  // Hooks.render but used for the kind's final normalization /
  // formatting pass once resource customizations have applied.
  // Mirrors HooksDefinition.post_render.
  repeated Hook post_render = 4;
}

// Registry is the top-level index written to <out>/registry.json by
// `veil build`. It maps kind name → entry describing how to find that kind's
// compiled artifacts. Consumers (e.g. `veil render`) read this to discover
// which kinds are available in a build artifact.
message Registry {
  // Kind name → entry pointing at the compiled kind document and its schema.
  // All paths are resolved against the registry.json's own directory.
  map<string, RegistryEntry> kinds = 1 [(buf.validate.field).map.keys.string.pattern = "^[a-z][a-z0-9_-]*$"];
}

// RegistryEntry describes a single kind in a Registry.
message RegistryEntry {
  // Name of the kind (matches the map key and Kind.name).
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$",
    (buf.validate.field).required = true
  ];

  // Relative path to the compiled kind.json (e.g. "./worker/kind.json").
  string path = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];

  // Relative path to the kind's composite resource schema
  // (e.g. "./worker/kind.schema.json").
  string schema = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

// Hook is a single hook bundled and minified from its TS/JS source,
// with all of its imports resolved and inlined. Used for both render-
// lifecycle entries (Hooks.render) and dependent-lifecycle entries
// (DependentHook.hooks); the shape is the same in either context.
message Hook {
  // Relative path from the kind directory (e.g. "hooks/hello-world.ts").
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];

  // Minified JavaScript bundle, ES module format.
  string content = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];

  // Host resources this hook is permitted to reach (carried forward
  // from the kind.json hook entry). The render runner pre-flights each
  // declared resource and exposes only what's listed to the hook.
  HookAccess access = 3;
}

// DependentHook is the compiled form of a KindDefinition.dependents
// entry: each hook source is bundled, and the params JSON Schema is
// embedded inline so rendering does not need access to the original
// kind directory.
message DependentHook {
  // The consumer kind that may depend on this resource (matches
  // DependentDefinition.kind).
  string kind = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$",
    (buf.validate.field).required = true
  ];

  // Compiled, bundled dependent hooks in declaration order.
  repeated Hook hooks = 2 [(buf.validate.field).repeated.min_items = 1];

  // Inlined contents of the params JSON Schema (raw JSON text).
  string params_schema = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}
